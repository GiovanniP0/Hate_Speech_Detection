seed: 123
mode: offline_save
base_long_side: 768

paths:
  # UPDATE: Point exactly to your emoji folder
  asset_base_dir: /scratch/utils/emoticons/emoticons_png/512
  rendered_root: /scratch/augmented_dataset/rendered

dataset:
  image_root: /scratch/datasets/MAMI/test
  mapping_json: /scratch/augmented_dataset/meta/mami_test_mapping.json
  recursive: true
  recompute_mapping: false

offline:
  # UPDATE: Rename folder to reflect the specific test
  output_root: /scratch/augmented_dataset/MAMI_laugh_dense_grid_80
  preserve_relative_to: /scratch/datasets/MAMI/test
  overwrite: false
  output_ext: .png
  image_quality: 95
  num_workers: 8

