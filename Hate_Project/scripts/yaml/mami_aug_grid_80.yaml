        - {asset_path: emoji_u1f602.png, center_x: 0.375, center_y: 0.125, size: 0.25, alpha: 0.80, rotation_degrees: 0, z_index: 1}
        - {asset_path: emoji_u1f602.png, center_x: 0.625, center_y: 0.125, size: 0.25, alpha: 0.80, rotation_degrees: 0, z_index: 2}
        - {asset_path: emoji_u1f602.png, center_x: 0.875, center_y: 0.125, size: 0.25, alpha: 0.80, rotation_degrees: 0, z_index: 3}
        
